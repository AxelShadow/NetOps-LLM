{# HTMX-фрагмент: результат проверки подключения.
   Ожидает: ok (bool), title (str), detail (str). #}
{% if ok %}
<span class="inline-flex items-center gap-1.5 font-semibold text-emerald-700">
    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>{{ title }}
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 font-semibold text-red-700">
    <span class="w-2 h-2 rounded-full bg-red-500"></span>{{ title }}
</span>
{% endif %}
<span class="block text-xs text-slate-500 mt-1">{{ detail }}</span>
