services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте в .env}
      POSTGRES_DB: netops
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Векторное хранилище RAG по runbook'ам (Этап 21). Отдельный сервис, а не
  # зависимость образа app: qdrant-client тянет grpcio и раздувает образ
  # (после инцидента ENOSPC образы бережём — docs/docker-image-size/).
  # Наружу порт НЕ пробрасывается: доступ только из сети compose по qdrant:6333,
  # поэтому HTTP-API Qdrant не оказывается на хосте.
  qdrant:
    # Явный пин конкретного патч-тега (не latest и не мажорный v1):
    # обновление версии — осознанное действие с проверкой совместимости.
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: ./backend
    env_file: .env
    environment:
      # :? — crypto.py падает при пустом ключе в проде (fail-fast на старте,
      # а не молчаливая смена ключа и «неверный пароль» на устройствах)
      NETOPS_ENCRYPTION_KEY: ${NETOPS_ENCRYPTION_KEY:?задайте в .env (см. .env.example)}
      # --- RAG по runbook'ам (Этап 21) ---
      # Адрес Qdrant — имя сервиса во внутренней сети compose, не наружу.
      NETOPS_RAG_QDRANT_URL: http://qdrant:6333
      # Каталог документов ВНУТРИ контейнера: ./runbooks монтируется ниже :ro.
      NETOPS_RAG_DOCS_DIR: /data/runbooks
      # Оба флага по умолчанию выключены: включаются оператором в .env,
      # чтобы прод без RAG/планировщика стартовал как раньше.
      NETOPS_RAG_ENABLED: ${NETOPS_RAG_ENABLED:-false}
      NETOPS_SCHEDULER_ENABLED: ${NETOPS_SCHEDULER_ENABLED:-false}
    volumes:
      # Корпус runbook'ов: правки на хосте подхватываются переиндексацией
      # без пересборки образа. :ro — приложение документы только читает.
      - ./runbooks:/data/runbooks:ro
    depends_on: [db, qdrant]
    restart: unless-stopped

  # Чат-приложение Chainlit (Фаза 11). Тонкий клиент FastAPI
  # /internal/chat/stream; своих диалогов не хранит.
  chainlit:
    build: ./chainlit
    environment:
      FASTAPI_INTERNAL_URL: http://app:8000
      CHAINLIT_ROOT_PATH: /chat        # nginx проксирует /chat -> :8001
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?задайте в .env (см. chainlit create-secret)}
      # :? — config.py падает при пустом токене; fail-fast на старте
      NETOPS_INTERNAL_SERVICE_TOKEN: ${NETOPS_INTERNAL_SERVICE_TOKEN:?задайте в .env}
      NETOPS_PROXY_AUTH_SECRET: ${NETOPS_PROXY_AUTH_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on: [app]
    restart: unless-stopped
    healthcheck:
      # curl в slim-образе нет; /health у chainlit под root_path-префиксом
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/chat/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    ports:
      # Порт наружу задаётся окружением сервера (.env: WEB_PORT=8081), дефолт 8080
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Шаблон прогоняется entrypoint-скриптом nginx через envsubst:
      # переменные NETOPS_* берутся из environment ниже.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend:/usr/share/nginx/html:ro
    environment:
      NETOPS_INTERNAL_SERVICE_TOKEN: ${NETOPS_INTERNAL_SERVICE_TOKEN:-}
      NETOPS_PROXY_AUTH_SECRET: ${NETOPS_PROXY_AUTH_SECRET:-}
    depends_on: [app, chainlit]
    restart: unless-stopped

volumes:
  pgdata:
  # Индекс Qdrant. Пересоздаётся переиндексацией runbook'ов; вместе с pgdata
  # НЕ удаляется: `docker compose down -v` на проде запрещён (см.
  # docs/docker-image-size/host-disk-runbook.md, раздел 3.7).
  qdrant_storage:
